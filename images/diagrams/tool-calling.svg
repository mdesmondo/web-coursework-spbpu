<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Схема вызова функции моделью</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Вызов функции (tool calling)</text>
<rect x="24" y="70" width="170" height="60" rx="12" fill="#ffffff" stroke="#e2e6ef" stroke-width="2"/>
<text x="109" y="97" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Приложение</text>
<text x="109" y="117" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">описания функций</text>
<rect x="24" y="290" width="170" height="60" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="109" y="317" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Функция</text>
<text x="109" y="337" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">search_docs()</text>
<rect x="450" y="70" width="166" height="60" rx="12" fill="#5b4bff" stroke="#5b4bff" stroke-width="2"/>
<text x="533" y="97" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">LLM</text>
<text x="533" y="117" font-size="13" fill="#ffffff" font-weight="400" text-anchor="middle">выбирает функцию</text>
<rect x="218" y="124" width="210" height="140" rx="10" fill="#121a33"/>
<text x="232" y="150" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">{</text>
<text x="232" y="170" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  "tool": "search_docs",</text>
<text x="232" y="190" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  "args": {</text>
<text x="232" y="210" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    "query": "лимит API"</text>
<text x="232" y="230" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  }</text>
<text x="232" y="250" font-size="13" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">}</text>
<text x="323" y="290" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">структурированный вызов</text>
<path d="M194 92 L448 92" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="84" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">1. запрос + схемы инструментов</text>
<path d="M533 130 L533 194 L430 194" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<text x="540" y="170" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">2. JSON</text>
<path d="M218 194 L110 194 L110 288" fill="none" stroke="#12b5a5" stroke-width="2" marker-end="url(#arr-t)"/>
<text x="118" y="250" font-size="13" fill="#12b5a5" font-weight="600" text-anchor="start">3. выполнить</text>
<path d="M194 330 L540 330 L540 132" fill="none" stroke="#5b4bff" stroke-width="2" marker-end="url(#arr-a)"/>
<text x="360" y="350" font-size="13" fill="#5b4bff" font-weight="600" text-anchor="middle">4. результат возвращается модели</text>
<text x="320" y="400" font-size="14" fill="#10162b" font-weight="600" text-anchor="middle">Модель только описывает вызов — выполняет его приложение.</text>
</g>
</svg>
