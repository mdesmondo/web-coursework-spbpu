<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Цикл агента: рассуждение, действие, наблюдение</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Цикл агента (ReAct)</text>
<rect x="40" y="70" width="150" height="64" rx="12" fill="#eeecff" stroke="#5b4bff" stroke-width="2"/>
<text x="115" y="99" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Задача</text>
<text x="115" y="119" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">цель пользователя</text>
<rect x="245" y="150" width="150" height="84" rx="12" fill="#5b4bff" stroke="#5b4bff" stroke-width="2"/>
<text x="320" y="189" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">LLM</text>
<text x="320" y="209" font-size="13" fill="#ffffff" font-weight="400" text-anchor="middle">рассуждение</text>
<rect x="450" y="70" width="150" height="64" rx="12" fill="#ffffff" stroke="#10162b" stroke-width="2"/>
<text x="525" y="99" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Действие</text>
<text x="525" y="119" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">вызов инструмента</text>
<rect x="450" y="250" width="150" height="64" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="525" y="279" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Инструмент</text>
<text x="525" y="299" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">поиск · код · API</text>
<rect x="245" y="330" width="150" height="64" rx="12" fill="#ffffff" stroke="#10162b" stroke-width="2"/>
<text x="320" y="359" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Наблюдение</text>
<text x="320" y="379" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">результат шага</text>
<rect x="40" y="250" width="150" height="64" rx="12" fill="#eeecff" stroke="#5b4bff" stroke-width="2"/>
<text x="115" y="279" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Ответ</text>
<text x="115" y="299" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">когда цель достигнута</text>
<path d="M190 110 C230 110 250 130 270 150" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M375 150 C395 125 420 110 448 104" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M525 134 L525 248" fill="none" stroke="#12b5a5" stroke-width="2" marker-end="url(#arr-t)"/>
<path d="M500 314 C470 350 430 362 397 362" fill="none" stroke="#12b5a5" stroke-width="2" marker-end="url(#arr-t)"/>
<path d="M320 330 L320 236" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M245 210 C215 230 200 250 190 262" fill="none" stroke="#5b4bff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-a)"/>
<text x="330" y="290" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">повторить</text>
<text x="178" y="236" font-size="13" fill="#5b4bff" font-weight="600" text-anchor="middle">готово</text>
</g>
</svg>
