<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="Segoe UI, Tahoma, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#1f2942" font-weight="bold">Цветовая палитра и оформление сайта</text>

<rect x="24" y="58" width="108" height="82" rx="8" fill="#1f2942" stroke="#d8dee9" stroke-width="2"/>
<text x="78" y="162" font-size="13" fill="#1f2942" font-weight="bold" text-anchor="middle">Шапка / подвал</text>
<text x="78" y="180" font-size="12" fill="#555e70" text-anchor="middle" font-family="Consolas, monospace">#1f2942</text>

<rect x="146" y="58" width="108" height="82" rx="8" fill="#3b5bdb" stroke="#d8dee9" stroke-width="2"/>
<text x="200" y="162" font-size="13" fill="#1f2942" font-weight="bold" text-anchor="middle">Основной синий</text>
<text x="200" y="180" font-size="12" fill="#555e70" text-anchor="middle" font-family="Consolas, monospace">#3b5bdb</text>

<rect x="268" y="58" width="108" height="82" rx="8" fill="#38d9a9" stroke="#d8dee9" stroke-width="2"/>
<text x="322" y="162" font-size="13" fill="#1f2942" font-weight="bold" text-anchor="middle">Зеленый акцент</text>
<text x="322" y="180" font-size="12" fill="#555e70" text-anchor="middle" font-family="Consolas, monospace">#38d9a9</text>

<rect x="390" y="58" width="108" height="82" rx="8" fill="#f2f4f8" stroke="#d8dee9" stroke-width="2"/>
<text x="444" y="162" font-size="13" fill="#1f2942" font-weight="bold" text-anchor="middle">Фон страницы</text>
<text x="444" y="180" font-size="12" fill="#555e70" text-anchor="middle" font-family="Consolas, monospace">#f2f4f8</text>

<rect x="512" y="58" width="104" height="82" rx="8" fill="#e6ecfa" stroke="#c5d1eb" stroke-width="2"/>
<text x="564" y="162" font-size="13" fill="#1f2942" font-weight="bold" text-anchor="middle">Блок акцента</text>
<text x="564" y="180" font-size="12" fill="#555e70" text-anchor="middle" font-family="Consolas, monospace">#e6ecfa</text>

<text x="24" y="232" font-size="40" fill="#1f2942" font-weight="bold">Aa</text>
<text x="92" y="218" font-size="14" fill="#1f2942" font-weight="bold">Segoe UI, Tahoma, Arial (16px) - основной текст</text>
<text x="92" y="240" font-size="14" fill="#555e70" font-family="Consolas, monospace">Consolas, Courier New (14px) - вставки кода</text>

<text x="24" y="286" font-size="15" fill="#1f2942" font-weight="bold">Примеры элементов интерфейса:</text>
<rect x="24" y="302" width="350" height="92" rx="8" fill="#f8fafd" stroke="#d8dee9" stroke-width="1.5"/>
<text x="42" y="330" font-size="14" fill="#1f2942" font-weight="bold">Стандартная карточка (.content-box)</text>
<text x="42" y="352" font-size="13" fill="#555e70">Белый фон, рамка #d8dee9, скругление углов 8px</text>
<text x="42" y="374" font-size="13" fill="#3652d9" text-decoration="underline">Обычная текстовая ссылка</text>

<rect x="404" y="274" width="212" height="120" rx="8" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
<rect x="404" y="274" width="212" height="46" rx="8" fill="#e6ecfa"/>
<text x="420" y="344" font-size="14" fill="#1f2942" font-weight="bold">Карточка задания</text>
<rect x="420" y="356" width="100" height="28" rx="6" fill="#3b5bdb"/>
<text x="470" y="375" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Открыть</text>
</g>
</svg>
