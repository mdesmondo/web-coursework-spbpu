<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Схема флекс-контейнеров ролика</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Флексы ролика</text>
<rect x="40" y="60" width="330" height="330" rx="6" fill="#f7f8fc" stroke="#10162b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="205" y="82" font-size="13" fill="#10162b" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">.roller — flex-direction: column</text>
<rect x="56" y="92" width="298" height="50" rx="12" fill="#eeecff" stroke="#5b4bff" stroke-width="2"/>
<text x="205" y="114" font-size="14" fill="#10162b" font-weight="700" text-anchor="middle">.roller__text</text>
<text x="205" y="134" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">flex: 0 0 3.6em</text>
<rect x="56" y="152" width="298" height="222" rx="8" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="205" y="174" font-size="13" fill="#10162b" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">.roller__stage — flex: 1, row</text>
<rect x="92" y="210" width="120" height="154" rx="12" fill="#ffffff" stroke="#10162b" stroke-width="2"/>
<text x="152" y="284" font-size="15" fill="#10162b" font-weight="700" text-anchor="middle">принц</text>
<text x="152" y="304" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">10em</text>
<rect x="222" y="254" width="96" height="110" rx="12" fill="#ffffff" stroke="#10162b" stroke-width="2"/>
<text x="270" y="306" font-size="15" fill="#10162b" font-weight="700" text-anchor="middle">героиня</text>
<text x="270" y="326" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">7em</text>
<line x1="70" y1="364" x2="340" y2="364" stroke="#5b4bff" stroke-width="3"/>
<text x="400" y="120" font-size="15" fill="#10162b" font-weight="700" text-anchor="start">Колонка:</text>
<text x="400" y="142" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">реплики — фиксированная высота,</text>
<text x="400" y="160" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">сцена забирает остаток.</text>
<text x="400" y="220" font-size="15" fill="#10162b" font-weight="700" text-anchor="start">Ряд в сцене:</text>
<text x="400" y="242" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">justify-content: center</text>
<text x="400" y="262" font-size="13" fill="#5b4bff" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">align-items: flex-end</text>
<text x="400" y="290" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">→ разные по росту персонажи</text>
<text x="400" y="308" font-size="13" fill="#5b6475" font-weight="400" text-anchor="start">стоят на одной линии пола.</text>
<path d="M396 296 L344 362" fill="none" stroke="#5b4bff" stroke-width="2" marker-end="url(#arr-a)"/>
</g>
</svg>
