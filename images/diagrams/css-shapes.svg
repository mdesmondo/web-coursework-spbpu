<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Приёмы CSS: круг, лист, треугольник, дуга</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Четыре приёма CSS-рисунка</text>
<rect x="40" y="70" width="120" height="120" fill="none" stroke="#e2e6ef" stroke-dasharray="4 4"/>
<ellipse cx="100" cy="130" rx="60" ry="60" fill="#8cc63f"/>
<text x="100" y="225" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">круг</text>
<text x="100" y="247" font-size="12" fill="#5b6475" font-weight="400" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">border-radius: 50%</text>
<rect x="200" y="100" width="120" height="60" fill="none" stroke="#e2e6ef" stroke-dasharray="4 4"/>
<path d="M200 100 A120 60 0 0 1 320 160 A120 60 0 0 1 200 100 Z" fill="#8cc63f"/>
<text x="260" y="225" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">лист</text>
<text x="260" y="247" font-size="12" fill="#5b6475" font-weight="400" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">0 100% 0 100%</text>
<polygon points="370,100 470,100 420,170" fill="#ffee58" stroke="#c9b800" stroke-width="1"/>
<polygon points="370,100 420,170 370,170" fill="none" stroke="#5b6475" stroke-dasharray="3 3"/>
<polygon points="470,100 420,170 470,170" fill="none" stroke="#5b6475" stroke-dasharray="3 3"/>
<text x="420" y="225" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">треугольник</text>
<text x="420" y="247" font-size="12" fill="#5b6475" font-weight="400" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">прозрачные рамки</text>
<rect x="510" y="80" width="100" height="100" fill="none" stroke="#e2e6ef" stroke-dasharray="4 4"/>
<path d="M514 180 L514 140 Q514 84 570 84 L610 84" fill="none" stroke="#00b80d" stroke-width="8"/>
<text x="560" y="225" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">дуга</text>
<text x="560" y="247" font-size="12" fill="#5b6475" font-weight="400" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">одна рамка + radius</text>
<rect x="24" y="290" width="592" height="100" rx="10" fill="#121a33"/>
<text x="44" y="322" font-size="14" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">.leaf  { border-radius: 0 100% 0 100%; }</text>
<text x="44" y="348" font-size="14" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">.tooth { width: 0; border-left: 3px solid transparent;</text>
<text x="44" y="372" font-size="14" fill="#dfe5ff" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">         border-top: 6px solid #ffee58; }</text>
</g>
</svg>
