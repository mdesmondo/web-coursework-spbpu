<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Оркестратор и агенты-исполнители</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Мультиагентная система</text>
<rect x="220" y="60" width="200" height="70" rx="12" fill="#5b4bff" stroke="#5b4bff" stroke-width="2"/>
<text x="320" y="92" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Оркестратор</text>
<text x="320" y="112" font-size="13" fill="#ffffff" font-weight="400" text-anchor="middle">делит задачу</text>
<rect x="30" y="220" width="170" height="70" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="115" y="252" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Исследователь</text>
<text x="115" y="272" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">поиск, чтение</text>
<rect x="235" y="220" width="170" height="70" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="320" y="252" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Программист</text>
<text x="320" y="272" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">пишет код</text>
<rect x="440" y="220" width="170" height="70" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="525" y="252" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Проверяющий</text>
<text x="525" y="272" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">тесты, ревью</text>
<path d="M260 130 L130 216" fill="none" stroke="#5b4bff" stroke-width="2" marker-end="url(#arr-a)"/>
<path d="M320 130 L320 216" fill="none" stroke="#5b4bff" stroke-width="2" marker-end="url(#arr-a)"/>
<path d="M380 130 L515 216" fill="none" stroke="#5b4bff" stroke-width="2" marker-end="url(#arr-a)"/>
<path d="M200 255 L233 255" fill="none" stroke="#12b5a5" stroke-width="2" marker-end="url(#arr-t)"/>
<path d="M405 255 L438 255" fill="none" stroke="#12b5a5" stroke-width="2" marker-end="url(#arr-t)"/>
<path d="M525 220 C560 150 480 110 422 100" fill="none" stroke="#10162b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="560" y="160" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">отчёт</text>
<rect x="170" y="330" width="300" height="52" rx="12" fill="#f7f8fc" stroke="#e2e6ef" stroke-width="2"/>
<text x="320" y="361.6" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Общее состояние задачи</text>
<path d="M115 290 L115 356 L168 356" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M320 290 L320 328" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M525 290 L525 356 L472 356" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-dasharray="3 4"/>
</g>
