<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<title>Конвейер оценки качества агента</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#10162b"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#5b4bff"/>
  </marker>
  <marker id="arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#12b5a5"/>
  </marker>
</defs>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="24" y="36" font-size="18" fill="#10162b" font-weight="700" text-anchor="start">Конвейер оценки (evals)</text>
<rect x="24" y="80" width="130" height="120" rx="12" fill="#eeecff" stroke="#5b4bff" stroke-width="2"/>
<text x="89" y="137" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Набор задач</text>
<text x="89" y="157" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">вход + эталон</text>
<rect x="184" y="80" width="130" height="120" rx="12" fill="#5b4bff" stroke="#5b4bff" stroke-width="2"/>
<text x="249" y="137" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Агент</text>
<text x="249" y="157" font-size="13" fill="#ffffff" font-weight="400" text-anchor="middle">новая версия</text>
<rect x="344" y="80" width="130" height="120" rx="12" fill="#ffffff" stroke="#10162b" stroke-width="2"/>
<text x="409" y="137" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Проверка</text>
<text x="409" y="157" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">код или LLM-судья</text>
<rect x="504" y="80" width="112" height="120" rx="12" fill="#e3f7f4" stroke="#12b5a5" stroke-width="2"/>
<text x="560" y="137" font-size="16" fill="#10162b" font-weight="700" text-anchor="middle">Отчёт</text>
<text x="560" y="157" font-size="13" fill="#5b6475" font-weight="400" text-anchor="middle">метрики</text>
<path d="M154 140 L182 140" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M314 140 L342 140" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M474 140 L502 140" fill="none" stroke="#10162b" stroke-width="2" marker-end="url(#arr)"/>
<path d="M560 200 C560 250 250 230 249 202" fill="none" stroke="#5b4bff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-a)"/>
<text x="400" y="250" font-size="13" fill="#5b4bff" font-weight="600" text-anchor="middle">изменили промпт или модель → прогнать заново</text>
<text x="30" y="318" font-size="15" fill="#10162b" font-weight="700" text-anchor="start">Что сравнивают между версиями:</text>
<text x="30" y="344" font-size="14" fill="#5b6475" font-weight="400" text-anchor="start">· долю решённых задач</text>
<text x="30" y="368" font-size="14" fill="#5b6475" font-weight="400" text-anchor="start">· число шагов и время</text>
<text x="30" y="392" font-size="14" fill="#5b6475" font-weight="400" text-anchor="start">· стоимость запросов к модели</text>
<text x="440" y="315" font-size="13" fill="#5b6475" font-weight="400" text-anchor="end">решено</text>
<rect x="450" y="302" width="150" height="16" rx="4" fill="#f7f8fc"/>
<rect x="450" y="302" width="123" height="16" rx="4" fill="#5b4bff"/>
<text x="440" y="345" font-size="13" fill="#5b6475" font-weight="400" text-anchor="end">шагов</text>
<rect x="450" y="332" width="150" height="16" rx="4" fill="#f7f8fc"/>
<rect x="450" y="332" width="82" height="16" rx="4" fill="#12b5a5"/>
<text x="440" y="375" font-size="13" fill="#5b6475" font-weight="400" text-anchor="end">стоимость</text>
<rect x="450" y="362" width="150" height="16" rx="4" fill="#f7f8fc"/>
<rect x="450" y="362" width="52" height="16" rx="4" fill="#5b6475"/>
</g>
</svg>
